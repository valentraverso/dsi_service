name: Deploy DSI Service

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: 🤖 Deploy DSI Service
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 📤 Enviar archivos por SSH (SCP)
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "."
          target: "${{ secrets.PROJECT_PATH }}"
          rm: false

      - name: 🔄 Levantar / Re-construir Docker & Diagnóstico
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            
            # Levantar contenedores
            docker compose up -d --build || docker-compose up -d --build
            
            echo "=== 1. DOCKER PROCESSES ==="
            docker ps
            
            echo "=== 2. LOCAL PORT 4000 HEALTH CHECK ==="
            sleep 3
            curl -i http://localhost:4000/health || true
            
            echo "=== 3. NGINX STATUS ==="
            sudo systemctl status nginx --no-pager -l || true
            
            echo "=== 4. NGINX CONFIG TEST ==="
            sudo nginx -t || true
            
            echo "=== 5. NGINX ENABLED SITES ==="
            ls -la /etc/nginx/sites-enabled/ || true
