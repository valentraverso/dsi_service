name: Deploy DSI Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: 🤖 Deploy DSI Service
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 📤 Enviar archivos por SSH (SCP)
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "."
          target: "${{ secrets.PROJECT_PATH }}"
          rm: false

      - name: 🔄 Levantar / Re-construir Docker (Sin Compose) & Diagnóstico
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            
            # 1. Detener y remover contenedor previo si existe
            docker stop dsi_service || true
            docker rm dsi_service || true
            
            # 2. Construir la imagen de Docker localmente
            docker build -t dsi_service .
            
            # 3. Correr el nuevo contenedor de forma nativa sin depender de docker-compose
            docker run -d \
              --name dsi_service \
              -p 4003:4003 \
              --restart unless-stopped \
              --shm-size=1g \
              --env-file .env \
              dsi_service
            
            echo "=== 1. DOCKER PROCESSES ==="
            docker ps
            
            echo "=== 2. LOCAL PORT 4003 HEALTH CHECK ==="
            sleep 3
            curl -i http://localhost:4003/health || true
